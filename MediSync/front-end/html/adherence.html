
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MediSync | Adherence</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
  <link rel="stylesheet" href="/front-end/css/global.css">
  <link rel="stylesheet" href="/front-end/css/adherence.css">
</head>

<body>

  <div class="global-page">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar-logo">
        <div class="brand">MediSync</div>
      </div>

      <div class="topbar-actions">

        <!-- PROFILE SELECTOR -->
        <details class="profile-selector" id="profile-selector">

          <summary class="profile-selector-button">

            <span class="profile-avatar">
              <i class="fa-solid fa-circle-user"></i>
            </span>

            <span class="selected-profile" id="selected-profile">
              My Medications
            </span>

            <i class="fa-solid fa-chevron-down dropdown-arrow"></i>

          </summary>

          <div class="profile-dropdown">

            <div class="dropdown-current-profile">
              <span class="profile-avatar large">
                <i class="fa-solid fa-circle-user"></i>
              </span>

              <span id="dropdown-current-name">
                My Medications
              </span>

              <i class="fa-solid fa-chevron-up"></i>
            </div>

            <div class="dropdown-content">

              <h2>People I Care For</h2>

              <button
                class="connected-profile"
                type="button"
                data-profile="MJ Fenol"
              >
                <span class="profile-avatar connected-avatar">
                  <i class="fa-solid fa-circle-user"></i>
                </span>

                <span>MJ Fenol</span>
              </button>

              <a
                href="profile.html#people-i-care-for"
                class="add-person"
              >
                <span class="add-person-icon">
                  <i class="fa-solid fa-plus"></i>
                </span>

                <span>Add a Person</span>
              </a>

            </div>
          </div>

        </details>

        <!-- NOTIFICATIONS -->
        <button
          class="notification-button"
          type="button"
          aria-label="Notifications"
          title="Notifications"
        >
          <i class="fa-solid fa-bell"></i>
        </button>

      </div>

    </header>


    <!-- MAIN LAYOUT -->
    <div class="global-layout">

      <!-- SIDEBAR -->
      <aside class="sidebar">

        <nav class="sidebar-navigation" aria-label="Main navigation">

          <a href="dashboard.html" class="nav-link">
            <i class="fa-solid fa-house-medical"></i>
            <span class="pagelink">Dashboard</span>
          </a>

          <a href="calendar.html" class="nav-link">
            <i class="fa-solid fa-calendar-days"></i>
            <span class="pagelink">Calendar</span>
          </a>

          <a href="medications.html" class="nav-link">
            <i class="fa-solid fa-capsules"></i>
            <span class="pagelink">Medications</span>
          </a>

          <a href="adherence.html" class="nav-link active">
            <i class="fa-solid fa-file-waveform"></i>
            <span class="pagelink">Adherence</span>
          </a>

          <a href="settings.html" class="nav-link">
            <i class="fa-solid fa-gear"></i>
            <span class="pagelink">Settings</span>
          </a>

        </nav>


        <!-- SIDEBAR USER INFORMATION -->
        <div class="sidebar-user">

          <div class="sidebar-user-information">

            <span class="sidebar-user-avatar">
              <i class="fa-solid fa-circle-user"></i>
            </span>

            <div class="sidebar-user-text">
              <span class="sidebar-user-name">
                User Name
              </span>

              <span class="sidebar-user-type">
                User
              </span>
            </div>

          </div>

          <a
            href="index.html"
            class="logout-button"
            aria-label="Log out"
            title="Log out"
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </a>

        </div>

      </aside>


      <!-- WORKSPACE -->
      <main class="workspace">
        <div class="adherence-header">
          <section class="headertx">
            <h3 id="">
              Medication Report
            </h3>
            <p>
              showing reports from <!--selected period-->
            </p>
          </section>

          <div class="adherence-action-buttons">
            <label class="period-selecttxt" for="report-period">
            Period
            <span class="sr-only">Select report period</span>
            <select id="report-period">
              <option value="today">Today</option>
              <option value="this-week">This Week</option>
              <option value="this-month">This Month</option>
              <option value="this-year">This Year</option>
              <option value="all-time">All Time</option>
            </select>
          </label>

            <button type="button" id="exportbtn">
              <i class="fa-solid fa-file-export"></i>
              Export
            </button>
          </div>
        </div>

        <div class="adherence-content">
          <div class="report-cards-container">
            <!--adherence report cards here-->
            <!--2x2 grid of cards similar to dashboard cards-->
          </div>
          <div class="dose-history-container">
            <!--recent dose history-->
            <div class="dose-history-header">
              <h3>Recent Dose History</h3>
              <button class="rdh-overlay-opener">
                View All <!--opens a overlay with dim bg-->
              </button>
            </div>
            <div class="dose-history-row">
              <div class="his-left-side">
                <!--date, med_img, med_name, time_recorded-->
              </div>
              <div class="his-right-side">
                <!--profile icon (if its recorded by someone else), status containter (taken,missed,late)-->
              </div>
            </div>
          </div>
        </div>
      </main>

    </div>

  </div>


  <!-- PROFILE SELECTOR INTERACTION -->
  <script>
    const profileSelector = document.getElementById("profile-selector");
    const selectedProfile = document.getElementById("selected-profile");
    const dropdownCurrentName = document.getElementById("dropdown-current-name");

    document.querySelectorAll(".connected-profile").forEach(profile => {
      profile.addEventListener("click", () => {
        const name = profile.dataset.profile;

        selectedProfile.textContent = name;
        dropdownCurrentName.textContent = name;

        profileSelector.open = false;
      });
    });
  </script>

</body>
</html>
