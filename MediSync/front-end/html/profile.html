
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MediSync | Profile</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
  <link rel="stylesheet" href="/front-end/css/global.css">
  <link rel="stylesheet" href="/front-end/css/profile.css">
  <link rel="stylesheet" href="/front-end/css/kimuel.css">
</head>

<body>

  <div class="global-page">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar-logo">
        <div class="brand">MediSync</div>
      </div>

      <div class="topbar-actions">   

        <!-- NOTIFICATIONS -->
        <button
          class="notification-button"
          type="button"
          aria-label="Notifications"
          title="Notifications"
        >
          <i class="fa-solid fa-bell"></i>
        </button>

      </div>

    </header>


    <!-- MAIN LAYOUT -->
    <div class="global-layout">

      <!-- SIDEBAR -->
      <aside class="sidebar">

        <nav class="sidebar-navigation" aria-label="Main navigation">

          <a href="dashboard.html" class="nav-link">
            Dashboard
          </a>

          <a href="calendar.html" class="nav-link">
            Calendar
          </a>

          <a href="medications.html" class="nav-link">
            Medications
          </a>

          <a href="adherence.html" class="nav-link">
            Adherence
          </a>

          <a href="profile.html" class="nav-link active">
            Profile
          </a>

        </nav>


        <!-- SIDEBAR USER INFORMATION -->
        <div class="sidebar-user">

          <div class="sidebar-user-information">

            <span class="sidebar-user-avatar">
              <i class="fa-solid fa-circle-user"></i>
            </span>

            <div class="sidebar-user-text">
              <span class="sidebar-user-name">
                User Name
              </span>

              <span class="sidebar-user-type">
                User
              </span>
            </div>

          </div>

          <a
            href="index.html"
            class="logout-button"
            aria-label="Log out"
            title="Log out"
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </a>

        </div>

      </aside>


      <!-- WORKSPACE -->
      <main class="workspace">
        <section class="profile-card">
          <h1>My Profile</h1>
          <p>Kimuel the Pharmacists uses these details to check that a medicine is safe for you, so you only need to tell Kimuel your symptoms.</p>
          <form class="profile-form" id="profile-form" novalidate>
            <div class="profile-field">
              <label for="p-name">Name</label>
              <input id="p-name" name="name" type="text" autocomplete="name">
            </div>
            <div class="profile-field">
              <label for="p-age">Age</label>
              <input id="p-age" name="age" type="number" min="0" max="120" inputmode="numeric">
            </div>
            <div class="profile-field">
              <label for="p-allergies">Known medicine allergies</label>
              <input id="p-allergies" name="allergies" type="text" placeholder="Type “none” if you have no allergies">
              <small>Example: penicillin, ibuprofen</small>
            </div>
            <div class="profile-field">
              <label for="p-preg">Pregnant or breastfeeding</label>
              <select id="p-preg" name="pregnantOrBreastfeeding">
                <option value="">Prefer not to say</option>
                <option value="no">No</option>
                <option value="yes">Yes</option>
                <option value="not applicable">Not applicable</option>
              </select>
            </div>
            <button class="profile-save" type="submit">Save profile</button>
            <p class="profile-status" id="profile-status" role="status"></p>
          </form>
        </section>
      </main>

    </div>

  </div>


  <!-- PROFILE SELECTOR INTERACTION -->
  <script>
    const profileSelector = document.getElementById("profile-selector");
    const selectedProfile = document.getElementById("selected-profile");
    const dropdownCurrentName = document.getElementById("dropdown-current-name");

    document.querySelectorAll(".connected-profile").forEach(profile => {
      profile.addEventListener("click", () => {
        const name = profile.dataset.profile;

        selectedProfile.textContent = name;
        dropdownCurrentName.textContent = name;

        profileSelector.open = false;
      });
    });
  </script>

  <script src="/js/profile.js"></script>
  <script src="/js/kimuel-rules.js"></script>
  <script src="/js/kimuel.js"></script>
</body>
</html>
