
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediSync | Account Setup</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/accountsetup.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="global-page account-setup-page"
        style="background-image: url('/images/account-setup-bg.png')"
        <header class="topbar"
                style="
              background-image: none;
              background-color: rgb(27, 75, 114);
              border-bottom: 1px solid;
              box-shadow: 2px">
            <div class="topbar-logo">
                <div class="brand">MediSync</div>
            </div>
        </header>


        <main class="workspace account-setup-workspace">

            <section class="account-setup-card">

                <header class="accsetup-header">
                    <div class="accsetup-heading">
                        <span class="accsetup-step">Profile Setup</span>
                        <h1>Complete Your Profile</h1>
                    </div>
                </header>

                <form id="accsetup-form" enctype="multipart/form-data">

                    <div class="form-fields">

                        <div class="field">
                            <label for="fullname">Full Name</label>
                            <input id="fullname" name="fullname" type="text"
                                   placeholder="Enter your full name" required>
                        </div>

                        <div class="field">
                            <label for="b-date">Birthdate</label>
                            <input id="b-date" name="b-date" type="date" required>
                        </div>

                        <div class="field full-width">
                            <label for="phone">Phone Number</label>
                            <input id="phone"
                                   name="phone"
                                   type="tel"
                                   placeholder="+63 912 345 6789"
                                   pattern="[0-9+\-\s\(\)]{7,20}"
                                   required>
                        </div>

                        <div class="form-divider">
                            <span>OPTIONAL</span>
                        </div>

                        <!-- PROFILE PICTURE -->
                        <div class="profile-upload-group">

                            <div class="profile-preview" id="profile-preview">
                                <i class="fa-solid fa-circle-user"></i>
                            </div>

                            <div class="profile-upload-information">
                                <h3>Profile Picture</h3>
                                <p>Add a picture to help identify your account.</p>

                                <input type="file"
                                       id="profile-pic"
                                       name="profile_pic"
                                       accept="image/png, image/jpeg, image/webp"
                                       class="sr-only">

                                <button type="button" id="pic-action-btn">
                                    <i class="fa-solid fa-camera"></i>
                                    Add a profile picture
                                </button>

                                <span id="file-name"></span>
                            </div>

                        </div>

                        <!-- ACCESSIBILITY -->
                        <div class="accessibility-section">

                            <div class="accessibility-information">
                                <span class="accessibility-icon">
                                    <i class="fa-solid fa-universal-access"></i>
                                </span>

                                <div>
                                    <h3>Accessibility Preferences</h3>
                                    <p>Customize the interface to make MediSync easier to use.</p>
                                </div>
                            </div>

                            <button type="button"
                                    id="a11y-toggle"
                                    aria-pressed="false">
                                Customize
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>

                        </div>

                    </div>

                    <p class="form-error" id="form-error" aria-live="polite"></p>

                    <div class="form-footer">
                        <button type="submit" class="finish-button">
                            Finish
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>

                </form>

            </section>

        </main>

    </div>
    <script src="/js/accountsetup.js"></script>
</body>
</html>
