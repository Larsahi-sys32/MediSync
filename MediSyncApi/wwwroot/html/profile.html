
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediSync | Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/settings.css">
</head>

<body>

    <div class="global-page">

        <!-- TOPBAR -->
        <header class="topbar">

            <div class="topbar-logo">
                <div class="brand">MediSync</div>
            </div>

            <div class="topbar-actions">
                <button class="notification-button"
                        type="button"
                        aria-label="Notifications"
                        title="Notifications">
                    <i class="fa-solid fa-bell"></i>
                </button>
            </div>

        </header>

        <!-- MAIN LAYOUT -->
        <div class="global-layout">

            <!-- SIDEBAR -->
            <aside class="sidebar">

                <nav class="sidebar-navigation" aria-label="Main navigation">

                    <a href="dashboard.html" class="nav-link">
                        Dashboard
                    </a>

                    <a href="calendar.html" class="nav-link">
                        Calendar
                    </a>

                    <a href="medications.html" class="nav-link">
                        Medications
                    </a>

                    <a href="adherence.html" class="nav-link">
                        Adherence
                    </a>

                    <a href="profile.html" class="nav-link active">
                        Profile
                    </a>

                </nav>

                <!-- SIDEBAR USER INFORMATION -->
                <div class="sidebar-user">

                    <div class="sidebar-user-information">

                        <span class="sidebar-user-avatar">
                            <i class="fa-solid fa-circle-user"></i>
                        </span>

                        <div class="sidebar-user-text">

                            <span class="sidebar-user-name">
                                User Name
                            </span>

                            <span class="sidebar-user-type">
                                User
                            </span>

                        </div>

                    </div>

                    <a href="index.html"
                       class="logout-button"
                       aria-label="Log out"
                       title="Log out">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    </a>

                </div>

            </aside>

            <!-- WORKSPACE -->
            <main class="workspace">

                <div class="profile-page">

                    <div class="profile-heading">
                        <h1>My Profile</h1>
                        <p>Manage your personal information and account details.</p>
                    </div>

                    <section class="profile-card">

                        <h2>Personal Information</h2>

                        <!-- PROFILE PICTURE -->
                        <div class="profile-picture-section">

                            <div class="profile-picture"
                                 id="profile-picture-preview">
                                <i class="fa-solid fa-circle-user"></i>
                            </div>

                            <div>

                                <input type="file"
                                       id="profile-picture-input"
                                       accept="image/png, image/jpeg, image/webp"
                                       hidden>

                                <button type="button"
                                        class="upload-picture-button"
                                        id="upload-picture-button">
                                    Change Profile Picture
                                </button>

                            </div>

                        </div>

                        <!-- PROFILE FORM -->
                        <form id="profile-form">

                            <div class="profile-form">

                                <div class="profile-field">
                                    <label for="profile-name">Full Name</label>
                                    <input type="text"
                                           id="profile-name"
                                           required>
                                </div>

                                <div class="profile-field">
                                    <label for="profile-birthday">Date of Birth</label>
                                    <input type="date"
                                           id="profile-birthday"
                                           required>
                                </div>

                                <div class="profile-field">
                                    <label for="profile-age">Age</label>
                                    <input type="number"
                                           id="profile-age"
                                           min="0"
                                           required>
                                </div>

                                <div class="profile-field">
                                    <label for="profile-emergency">Emergency Contact</label>
                                    <input type="tel"
                                           id="profile-emergency"
                                           required>
                                </div>

                            </div>

                            <!-- SAVE BUTTON -->
                            <div class="profile-actions">

                                <button type="submit"
                                        class="save-profile-button">
                                    Save Changes
                                </button>

                            </div>

                            <p id="profile-error"></p>

                        </form>

                    </section>

                </div>

            </main>

        </div>

    </div>

    <!-- PROFILE JAVASCRIPT -->
    <script src="/js/profile.js"></script>

</body>
</html>
